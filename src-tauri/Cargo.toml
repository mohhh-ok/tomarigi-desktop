[package]
name = "tomarigi-desktop"
version = "0.13.0"
description = "tomarigi desktop"
authors = ["MOhhh"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tomarigi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
tauri-plugin-single-instance = "2"
# Calls the TypeSafe API (typesafe_systemone in keys.rs; requests from WKWebView are blocked by CORS)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Reads OpenCode's session database read-only (opencode.rs). Bundled so it doesn't depend on the system's libsqlite3
rusqlite = { version = "0.37", features = ["bundled"] }
# Updates the app from latest.json on the newest GitHub Release (updater.rs; docs/design.md "Updates"). 2.10 or later
# for .deb; held below 2.13, which needs tauri 2.12 (tauri is pinned to 2.11.1 below)
tauri-plugin-updater = "~2.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# NSRunningApplication + libc: finds the terminal app that owns an agent and activates it by pid (focus/). NSWorkspace +
# block2: brings an app forward through LaunchServices (open_app in focus/sb.rs)
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSRunningApplication", "libc", "NSWorkspace", "block2"] }
objc2 = "0.6"
# The frosted glass behind the window (set_backdrop in window.rs) uses NSString and NSRect
# NSValue (NSNumber) sets Terminal.app window properties through ScriptingBridge (focus/terminal_app.rs); NSURL gives the
# bundle path of WezTerm / kitty for their CLI (focus/sb.rs)
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSArray", "NSValue", "NSURL"] }
# Stores BYOK API keys in the macOS Keychain (KeyStore in keys.rs)
security-framework = "3"
tauri-nspanel = "2.1"
# tauri is pinned to =2.11.1 to match @tauri-apps/api 2.11.1 on the npm side (tauri build stops on a major/minor mismatch).
# The crates below are held to the minor versions tauri 2.11.1 resolves to, so cargo update doesn't pull a newer minor
tauri-macros = "~2.6"
tauri-utils = "~2.9"
tauri-runtime = "~2.11"
tauri-runtime-wry = "~2.11"

# Windows and Linux (docs/design.md "Platforms"). BYOK API keys go to Windows Credential Manager / Linux Secret Service
# (KeyStore in keys.rs). The v1 feature picks the store per OS
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4.2"
# Tray menu language from the system locale (tray.rs; macOS reads `defaults`)
sys-locale = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Processes without `ps` / `lsof` on Windows: liveness, parents, command lines, working directories (liveness.rs, focus/)
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Held to the version tauri already pulls in. Window lookup and focus (focus/win32.rs), mouse buttons (fade.rs), and
# the Restart Manager for Codex's lock holders (liveness.rs)
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_RestartManager",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The folder picker uses GTK on Linux (tauri already links GTK 3)
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3"] }
# X11 (EWMH): the terminal window by _NET_WM_PID and _NET_ACTIVE_WINDOW (focus/x11.rs), and the mouse buttons (fade.rs)
x11rb = "0.14"
