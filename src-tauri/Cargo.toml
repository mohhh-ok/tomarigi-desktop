[package]
name = "tomarigi-desktop"
version = "0.2.0"
description = "tomarigi desktop"
authors = ["MOhhh"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tomarigi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
tauri-plugin-single-instance = "2"
# Calls the TypeSafe API (typesafe_systemone in lib.rs; requests from WKWebView are blocked by CORS)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }
objc2 = "0.6"
# The frosted glass behind the window (set_backdrop in lib.rs) uses NSString and NSRect
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
# Stores BYOK API keys in the macOS Keychain (KeyStore in lib.rs)
security-framework = "3"
tauri-nspanel = "2.1"
# Pin the Rust side to 2.11.x to match @tauri-apps/api 2.11 on the npm side (tauri build stops on a major/minor mismatch)
tauri-macros = "~2.6"
tauri-utils = "~2.9"
tauri-runtime = "~2.11"
tauri-runtime-wry = "~2.11"
