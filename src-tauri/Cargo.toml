[package]
name = "tomarigi-desktop"
version = "0.1.0"
description = "tomarigi desktop"
authors = ["MOhhh"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tomarigi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
tauri-plugin-single-instance = "2"
# TypeSafe の API を叩く(lib.rs の typesafe_systemone。WKWebView からは CORS で弾かれる)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics"] }
objc2 = "0.6"
# 窓の後ろのすりガラス(lib.rs の set_backdrop)で NSString・NSRect を使う
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
# BYOK の API キーを macOS のキーチェーンに保存する(lib.rs の KeyStore)
security-framework = "3"
tauri-nspanel = "2.1"
# npm 側 @tauri-apps/api 2.11 に合わせて Rust 側を 2.11 系に固定(tauri build がメジャー/マイナー不一致で止まるため)
tauri-macros = "~2.6"
tauri-utils = "~2.9"
tauri-runtime = "~2.11"
tauri-runtime-wry = "~2.11"
