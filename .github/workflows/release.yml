# Pushing a v* tag builds a signed and notarized universal .dmg and attaches it to a draft GitHub Release, then
# the Windows installer (NSIS, not code-signed) and the Linux packages (deb, AppImage) to the same draft.
# Publish the draft by hand after checking it. Required secrets are listed in docs/release.md
# Every build also makes signed updater bundles, and tauri-action adds each platform to latest.json on the release,
# which the app's updater reads once the release is published (docs/design.md "Updates")
# Started by hand (workflow_dispatch), it runs the same builds without signing, makes no release, and keeps the
# bundles as workflow artifacts instead (docs/release.md "Building without a release")
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Third-party actions are pinned to a commit (the tag they pointed to is in the comment), so a moved tag can't change
# what runs with the release token. Each job gets only what it needs: all of them upload to the draft release.
# Permissions can't depend on the event, so a manual run gets contents: write too; its steps get no token or secrets, and
# checkout doesn't leave the token in .git/config (persist-credentials: false), so the repo's own code can't read it either
permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check that the tag matches the app version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::tag and app versions differ"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          # The .app.tar.gz for the updater comes with the app bundle; latest.json gets it as both darwin-aarch64 and
          # darwin-x86_64 (it is universal)
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: tomarigi-desktop ${{ github.ref_name }}
          releaseDraft: true

      # tauri-action notarizes only the .app inside. Notarize the .dmg too so the downloaded file itself passes Gatekeeper
      - name: Notarize and staple the .dmg
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

      # A copy under a name without the version (Tomarigi-macOS.dmg here; the other jobs do the same for theirs), so
      # moh-tech.net/tomarigi/desktop/ can link to releases/latest/download/<name> for every release (docs/design.md
      # "Download page")
      - name: Attach the .dmg under a fixed name
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected one file for Tomarigi-macOS.dmg, found: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "$RUNNER_TEMP/Tomarigi-macOS.dmg"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Tomarigi-macOS.dmg" --clobber

      # A manual run: no tagName, so tauri-action makes no release; unsigned, since no Apple secrets are passed. No updater
      # bundles either, since they can't be made without the updater key (same in the Windows and Linux jobs)
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          tauriScript: bun run tauri
          args: --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true

  # Tomarigi's VS Code extension (vscode-extension/). Tests it inside a downloaded VS Code and attaches the .vsix to the
  # same draft release. Publishing to the Marketplace / Open VSX is done by hand (docs/release.md)
  vsix:
    permissions:
      contents: write
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check that the tag matches the extension version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./package.json').version")
          echo "tag=$tag vscode-extension/package.json=$ext"
          if [ "$tag" != "$ext" ]; then
            echo "::error::tag and extension versions differ"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      # VS Code needs a display
      - run: xvfb-run -a bun run test:integration

      - name: Build the .vsix
        if: github.event_name == 'push'
        run: |
          bun run package
          mv tomarigi.vsix "tomarigi-${GITHUB_REF_NAME}.vsix"

      - name: Attach the .vsix to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "tomarigi-${GITHUB_REF_NAME}.vsix" --clobber

      - name: Attach the .vsix under a fixed name
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "tomarigi-${GITHUB_REF_NAME}.vsix" "$RUNNER_TEMP/Tomarigi-VSCode.vsix"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Tomarigi-VSCode.vsix" --clobber

      - name: Build the .vsix (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: bun run package

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tomarigi-vsix
          path: vscode-extension/tomarigi.vsix
          if-no-files-found: error

  # Windows and Linux run after the macOS job so that it creates the draft release first and they add to it
  # (two jobs creating the draft at once could make two drafts). docs/design.md "Platforms".
  # Linux also waits for Windows: tauri-action reads latest.json from the release, adds its platforms, and uploads it
  # again, so two jobs doing that at once could drop the other's entries
  release-windows:
    permissions:
      contents: write
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # Not code-signed (docs/design.md "Platforms"), so Windows shows a SmartScreen warning on first run
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: tomarigi-desktop ${{ github.ref_name }}
          releaseDraft: true

      - name: Attach the installer under a fixed name
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected one file for Tomarigi-Windows-setup.exe, found: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "$RUNNER_TEMP/Tomarigi-Windows-setup.exe"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Tomarigi-Windows-setup.exe" --clobber

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          tauriScript: bun run tauri
          args: --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true

  release-linux:
    permissions:
      contents: write
    needs: [release, release-windows]
    # The oldest supported Ubuntu, so the deb and AppImage run on older glibc too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # https://v2.tauri.app/start/prerequisites/ (WebKitGTK 4.1, the tray's appindicator)
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --bundles deb,appimage
          tagName: ${{ github.ref_name }}
          releaseName: tomarigi-desktop ${{ github.ref_name }}
          releaseDraft: true

      - name: Attach the .deb under a fixed name
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected one file for Tomarigi-Linux.deb, found: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "$RUNNER_TEMP/Tomarigi-Linux.deb"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Tomarigi-Linux.deb" --clobber

      - name: Attach the AppImage under a fixed name
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected one file for Tomarigi-Linux.AppImage, found: ${files[*]}"
            exit 1
          fi
          cp "${files[0]}" "$RUNNER_TEMP/Tomarigi-Linux.AppImage"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/Tomarigi-Linux.AppImage" --clobber

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          tauriScript: bun run tauri
          args: --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true
